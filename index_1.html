/* menu buttons */
.menu .ghost,.menu .actions .skip,.menu .row>button{font-family:var(--f-head);font-weight:800;letter-spacing:.02em;font-size:.95rem;padding:10px 18px;border-radius:999px;cursor:pointer;color:var(--gold);background:var(--tile);border:2px solid color-mix(in srgb,var(--gold) 50%,transparent);box-shadow:0 3px 0 rgba(0,0,0,.28);transition:transform .15s,background .15s,box-shadow .15s}

/* ---- fixes from browser testing ---- */
.menu .colors>.hint{font-weight:400;color:var(--muted);font-size:.92rem;margin:4px 0}
.menu .colors>.hint:first-child,.menu .colors>.hint.sub{font-weight:800;color:var(--ink);font-size:1rem;margin:12px 0 2px}
.menu>.panel{grid-template-columns:minmax(0,1fr)}
.menu .ed input,.menu .ed select,.menu .qrow input,.menu .qrow select,.menu .rowdef input,.menu .rowdef select{min-width:0;max-width:none}
.menu .tabs button{padding:10px 11px;font-size:.96rem}
.qrow [data-f="type"]{flex:1 1 190px}
@media (max-width:640px){
  .rowdef{grid-template-columns:56px 1fr 1fr}
  .rowdef>select{grid-column:1/-1}
  .menu{padding:18px 16px}
}
@media (max-width:560px){
  .cat{padding:4px;gap:2px}
  .arrow{padding:6px 3px;font-size:1.15em}
  .catmid{font-size:.9em}
}
.menu .dims label{flex:1 1 150px}
.menu .dims select{width:auto;flex:none}
@media (max-width:700px){.board{--colmin:84px;overflow-x:auto;padding-bottom:6px}}
.cat{min-width:0}
.catmid{overflow-wrap:break-word;word-break:normal;hyphens:auto}
.tile{min-width:0}
@media (min-width:701px){
  .board[data-dense="1"] .tile{font-size:clamp(.95rem,2.6vw,1.6rem)}
  .board[data-dense="1"] .cat{font-size:clamp(.7rem,1.5vw,.95rem)}
  .board[data-dense="2"] .tile{font-size:clamp(.75rem,1.8vw,1.2rem)}
  .board[data-dense="2"] .cat{font-size:clamp(.6rem,1.15vw,.82rem);padding:4px 2px}
  .board[data-dense="1"] .arrow,.board[data-dense="2"] .arrow{padding:4px 2px;font-size:1em}
}
/* warning banner: red so it stands out */
.warn{background:color-mix(in srgb,#e53935 40%,var(--panel));border:2px solid #ff5252;border-left-width:8px}
.warn p{font-weight:700}
.warn .hint{font-weight:400}
/* colored messages: red = error, yellow = needs attention, blue = working, green = done */
.hint.msg-err,.hint.msg-warn,.hint.msg-info,.hint.msg-ok{color:var(--ink);font-weight:700;padding:9px 12px;border-radius:10px;border-left:6px solid;margin:6px 0}
.hint.msg-err{background:color-mix(in srgb,#e53935 30%,transparent);border-color:#ff5252}
.hint.msg-warn{background:color-mix(in srgb,#ffb300 28%,transparent);border-color:#ffb300}
.hint.msg-info{background:color-mix(in srgb,#4c8dff 24%,transparent);border-color:#4c8dff}
.hint.msg-ok{background:color-mix(in srgb,#2fbf71 26%,transparent);border-color:#2fbf71}
.ed input.bad{border-color:#ff5252!important;box-shadow:0 0 0 3px rgba(255,82,82,.45)}
</style>
</head>

function useBomb(){

  const curLibs=board.map(c=>c.lib);
  const free=pool.filter(i=>fixedLibs.indexOf(i)<0);
  const order=free.filter(i=>curLibs.indexOf(i)<0).concat(free.filter(i=>curLibs.indexOf(i)>=0));
  let k=0;

function placeBombs(n){

  if(bombFixed()&&randPerks&&perkCfg.bomb.on&&n>0){
    const cand=[];
    board.forEach((c,ci)=>c.clues.forEach((x,r)=>{
      const key=ci+"-"+r;

    }));
    for(let i=cand.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=cand[i];cand[i]=cand[j];cand[j]=t}
    cand.slice(0,n).forEach(k=>bombSet.add(k));
  }
  renderBombLbl();
}

function rollPerk(cl,ci,r){
  if(!randPerks||perkExcl.cols.has(ci)||perkExcl.rows.has(r))return null;
  if(onePerkTurn&&perkThisTurn)return null;
  const key=ci+"-"+r;
  if(bombFixed()&&perkCfg.bomb.on&&bombSet.has(key)){
    bombSet.delete(key);perkCount.bomb++;perkThisTurn=true;renderBombLbl();
    return "bomb";
  }
  const kinds=["bomb","delegate"].filter(k=>{
    const c=perkCfg[k];
    if(!c.on||c.chance<=0)return false;
    if(k==="bomb"&&bombFixed())return false;
    if(c.qty>0&&perkCount[k]>=c.qty)return false;
    if(k==="delegate"&&(isGroup(cl)||teams.length<2))return false;
    return true;
  });
  for(let i=kinds.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=kinds[i];kinds[i]=kinds[j];kinds[j]=t}
  for(let i=0;i<kinds.length;i++){if(Math.random()*100<perkCfg[kinds[i]].chance){perkCount[kinds[i]]++;perkThisTurn=true;return kinds[i]}}
  return null;
}

function applyEd(){

  for(const w of [1,2]){if(badB(w)){if(edWhich!==w)switchBoard(w);say(edMsg,"incomplete");markInvalid();return false}}
  for(const w of [1,2]){

    for(let ci=0;ci<B.length;ci++)for(const x of B[ci].clues){

      if(seen.has(k)){if(edWhich!==w)switchBoard(w);selCol(ci);edMsg.textContent=rqText("Repeated question in "+(w===1?"Board 1":"Board 2")+" (columns "+(seen.get(k)+1)+" and "+(ci+1)+"): “"+k+"”. Every question must be different.","Pregunta repetida en "+(w===1?"el Tablero 1":"el Tablero 2")+" (columnas "+(seen.get(k)+1)+" y "+(ci+1)+"): “"+k+"”. Todas las preguntas deben ser distintas.");return false}
      seen.set(k,ci);
    }
  }
  edStore[1]&&numberDups(edStore[1]);edStore[2]&&numberDups(edStore[2]);
  const b1=edStore[1]||JSON.parse(JSON.stringify(board));
  if(edStore[2]&&JSON.stringify(edStore[2])!==ed2Orig){board2Saved=JSON.parse(JSON.stringify(edStore[2]));try{localStorage.setItem("jp-board2",JSON.stringify(board2Saved))}catch(x){}}
  board=JSON.parse(JSON.stringify(b1));custom=true;

  ed=null;edStore={1:null,2:null};edWhich=1;edDirty=false;newGame();showTab("Game");
  return true;
}

    }

  warnBusy=true;renderWarn();say(msg,"rndGen");

    "For each item write exactly \"count\" new clues of its \"type\" about its topic, at its difficulty level, rising gradually in difficulty. Never repeat or closely copy the clues listed in \"existing\". "+GEN_DOC,
    "Be accurate and unambiguous.",
    "Items: "+JSON.stringify(items),
    "Reply with only JSON in this shape: [{\"col\":<number>,\"clues\":[<clue objects>]}] with one object per item, in the same order."].join("\n");
  try{
    const out=await sample.json(prompt,{cache:false});
    const probe=ty=>ty==="normal"?{}:{type:ty};
    if(!Array.isArray(out)||out.length!==items.length||out.some((o,i)=>!o||o.col!==items[i].col||!Array.isArray(o.clues)||o.clues.length!==items[i].count||o.clues.some(x=>!applyGen(probe(items[i].type),x))))throw new Error("shape");
    out.forEach((o,i)=>{

const LNAME=()=>lang==="es"?"Spanish":"English";
const GEN_DOC="Each clue object depends on its \"type\": normal -> {\"q\":\"a clue statement\",\"a\":\"the answer phrased as a question, for example: What is Mars?\"}; tf -> {\"q\":\"a statement that is clearly either true or false\",\"truth\":true or false}; hl -> {\"q\":\"a question about a real number that states a reference number and asks whether the real value is higher or lower than it\",\"ref\":the reference number,\"target\":the real number}; closest -> {\"q\":\"a question whose answer is one single number\",\"target\":that number}; mc -> {\"q\":\"a clear question with exactly one correct answer\",\"a\":\"the short correct answer\",\"wrong\":[\"five plausible but clearly wrong short options\"]}. All numbers must be plain JSON numbers, and ref must differ from target.";
const slotType=x=>x.type||"normal";
const aiType=x=>isImg(x)?"normal":slotType(x);
function applyGen(slot,x){
  if(!x||!x.q)return false;
  const t=slotType(slot);
  if(t==="normal"||/^img/.test(t)){if(!x.a)return false;slot.q=String(x.q);slot.a=String(x.a);return true}
  if(t==="mc"){if(!x.a||!Array.isArray(x.wrong)||!x.wrong.length)return false;slot.q=String(x.q);slot.a=String(x.a);slot.ch=x.wrong.map(String).slice(0,5);return true}
  if(t==="tf"){if(typeof x.truth!=="boolean")return false;slot.q=String(x.q);slot.truth=x.truth;slot.a="";return true}
  if(t==="hl"){if(!Number.isFinite(x.ref)||!Number.isFinite(x.target)||x.ref===x.target)return false;slot.q=String(x.q);slot.ref=x.ref;slot.target=x.target;slot.a="";return true}
  if(!Number.isFinite(x.target))return false;
  slot.q=String(x.q);slot.target=x.target;slot.a="";return true;
}
function clueOk(x){
  if(x.empty)return true;
  if(!x.q.trim())return false;
  const t=slotType(x);
  if(t==="tf")return typeof x.truth==="boolean";
  if(t==="hl")return Number.isFinite(x.ref)&&Number.isFinite(x.target);
  if(t==="closest")return Number.isFinite(x.target);
  if(t==="mc")return !!x.a.trim()&&Array.isArray(x.ch)&&x.ch.length>=1;
  return !!x.a.trim();
}

function parseCSV(t){
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===","||c===";"&&false){row.push(f);f=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;row.push(f);f="";if(row.some(x=>x.trim()))rows.push(row);row=[]}
    else f+=c}
  row.push(f);if(row.some(x=>x.trim()))rows.push(row);
  return rows;
}
function importCSV(text){
  const edMsg=document.getElementById("edMsg");
  let rows=parseCSV(text.replace(/^﻿/,""));
  if(rows.length&&isNaN(parseFloat(rows[0][1])))rows=rows.slice(1);
  const cats=new Map();let n=0;
  rows.forEach(r=>{
    const cat=(r[0]||"").trim(),pts=Math.round(parseFloat(r[1])),q=(r[2]||"").trim(),a=(r[3]||"").trim(),img=(r[4]||"").trim();
    if(!cat||!isFinite(pts)||!q||!a)return;
    if(!cats.has(cat)){if(cats.size>=10)return;cats.set(cat,[])}
    const arr=cats.get(cat);if(arr.length>=10)return;
    const cl={pts,time:null,q,a};if(okImg(img))cl.img=img;arr.push(cl);n++;
  });
  if(!n){say(edMsg,"csvBad");return}
  const nb=[];let maxR=0;cats.forEach(a=>{maxR=Math.max(maxR,a.length)});
  cats.forEach((arr,cat)=>{arr.sort((x,y)=>x.pts-y.pts);while(arr.length<maxR)arr.push({pts:(VALUES[arr.length]||(arr.length+1)*100),time:null,q:"",a:"",empty:true});nb.push({cat,clues:arr})});
  if(!validBoard(nb)){say(edMsg,"csvBad");return}
  board=nb;custom=true;
  try{localStorage.setItem("jp-board",JSON.stringify(board))}catch(x){}
  ed=null;edDirty=false;newGame();showTab("Game");
  const m=document.getElementById("teamMsg");if(m){m.textContent=T("csvOk").split("{n}").join(n).split("{c}").join(cats.size);m.className="hint msg-ok"}
}

<style id="fxCss">
@keyframes fxCardIn{0%{transform:perspective(900px) rotateX(-75deg) scale(.4);opacity:0}60%{transform:perspective(900px) rotateX(10deg) scale(1.03);opacity:1}100%{transform:none}}
@keyframes fxTileIn{0%{transform:rotateX(90deg) scale(.6);opacity:0}100%{transform:none;opacity:1}}
@keyframes fxShake{0%,100%{transform:none}20%{transform:translateX(-12px) rotate(-1deg)}40%{transform:translateX(10px) rotate(1deg)}60%{transform:translateX(-7px)}80%{transform:translateX(5px)}}
@keyframes fxGlow{0%{box-shadow:0 0 0 0 var(--good)}100%{box-shadow:0 0 0 26px transparent}}
@keyframes fxPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes fxPop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes fxFloat{0%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,-60px);opacity:0}}
@keyframes fxBoom{0%{filter:none;transform:none}10%{filter:brightness(2.2);transform:scale(1.02) translate(6px,-4px)}30%{transform:translate(-8px,5px)}50%{transform:translate(6px,3px)}100%{filter:none;transform:none}}
@keyframes fxReveal{0%{opacity:0;transform:translateY(12px) scale(.9);filter:blur(6px)}100%{opacity:1;transform:none;filter:none}}
@keyframes fxTick{0%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes fxTrophy{0%{transform:scale(0) rotate(-20deg)}70%{transform:scale(1.2) rotate(6deg)}100%{transform:none}}
dialog#dlg[open] .card{animation:fxCardIn .55s cubic-bezier(.2,.9,.3,1.2)}
.card.fx-right{animation:fxGlow .8s ease-out!important}
.card.fx-wrong{animation:fxShake .45s!important}
.card.fx-dd{animation:fxPulse .5s 3!important}
.fx-boom{animation:fxBoom .6s!important}
.board.fx-deal .tile,.board.fx-deal .cat{animation:fxTileIn .45s both cubic-bezier(.2,.9,.3,1.2)}
.score.fx-pop{animation:fxPop .5s}
.score.fx-up{color:var(--good)!important}.score.fx-down{color:var(--bad)!important}
.team{position:relative}
.fx-float{position:absolute;left:50%;top:30%;font-weight:800;font-size:1.3rem;pointer-events:none;animation:fxFloat 1.1s ease-out forwards;z-index:3}
#answer.fx-show{animation:fxReveal .45s ease-out}
.timer.late.fx-tick{animation:fxTick .3s}
#resWinner{animation:fxTrophy .7s cubic-bezier(.2,.9,.3,1.3)}
#fxCanvas{position:fixed;inset:0;pointer-events:none;z-index:2147483647}
#fxMute{min-width:44px}
@media (prefers-reduced-motion:reduce){dialog#dlg[open] .card,.card.fx-right,.card.fx-wrong,.card.fx-dd,.fx-boom,.board.fx-deal .tile,.board.fx-deal .cat,.score.fx-pop,#answer.fx-show,#resWinner{animation:none!important}}
</style>
<script>
(()=>{
const RM=matchMedia("(prefers-reduced-motion:reduce)").matches;
let muted=true;try{muted=localStorage.getItem("jp-mute")!=="0"}catch(e){}
let ac=null;
const ctx=()=>{if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(ac.state==="suspended")ac.resume();return ac};
addEventListener("pointerdown",ctx,{once:true,capture:true});
function tone(f,d,o={}){if(muted)return;const a=ctx();if(!a)return;const t=a.currentTime+(o.at||0),g=a.createGain(),s=a.createOscillator();
  s.type=o.type||"sine";s.frequency.setValueAtTime(f,t);if(o.to)s.frequency.exponentialRampToValueAtTime(o.to,t+d);
  const v=(o.vol||.18);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(g).connect(a.destination);s.start(t);s.stop(t+d+.02)}
function noise(d,o={}){if(muted)return;const a=ctx();if(!a)return;const t=a.currentTime+(o.at||0),n=a.sampleRate*d,b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);
  for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*Math.pow(1-i/n,o.decay||2);
  const src=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();src.buffer=b;f.type="lowpass";f.frequency.setValueAtTime(o.f||1200,t);if(o.fto)f.frequency.exponentialRampToValueAtTime(o.fto,t+d);
  g.gain.value=o.vol||.4;src.connect(f).connect(g).connect(a.destination);src.start(t)}
const notes=(arr,step,o)=>arr.forEach((f,i)=>tone(f,o&&o.d||.18,Object.assign({},o,{at:i*step})));
const SFX={
  pick(){noise(.25,{f:600,fto:3000,vol:.15,decay:1});tone(300,.25,{to:900,type:"triangle",vol:.08})},
  reveal(){notes([784,1047,1319],.07,{type:"triangle",vol:.12,d:.35})},
  right(){notes([523,659,784,1047],.09,{type:"square",vol:.07,d:.22});tone(1568,.5,{at:.36,type:"triangle",vol:.1})},
  wrong(){tone(180,.45,{type:"sawtooth",vol:.12,to:110});tone(185,.45,{type:"sawtooth",vol:.08,to:112})},
  skip(){tone(500,.15,{to:300,type:"triangle",vol:.1})},
  tick(){tone(1200,.05,{type:"square",vol:.05})},
  timeup(){tone(220,.7,{type:"square",vol:.1});tone(233,.7,{type:"square",vol:.07})},
  dd(){notes([392,523,659,784,659,784,1047],.1,{type:"square",vol:.07,d:.2});noise(.6,{at:.7,f:4000,vol:.12,decay:3})},
  bomb(){noise(1.2,{f:900,fto:60,vol:.7,decay:1.5});tone(90,.9,{to:35,type:"sine",vol:.35})},
  delegate(){noise(.35,{f:2500,fto:400,vol:.15,decay:1});tone(700,.3,{to:350,type:"triangle",vol:.08})},
  win(){notes([523,523,523,659,784,659,784,1047],.14,{type:"square",vol:.07,d:.25});notes([262,330,392,523],.28,{type:"triangle",vol:.08,d:.5})},
  coin(){tone(988,.08,{type:"square",vol:.06});tone(1319,.25,{at:.08,type:"square",vol:.06})},
  down(){tone(400,.2,{to:200,type:"triangle",vol:.1})},
  click(){tone(900,.04,{type:"triangle",vol:.05})}
};
window.jpSFX=SFX;

/* confetti */
let cv,cx,parts=[],raf=0;
function confetti(n,burst){if(RM)return;if(!cv){cv=document.createElement("canvas");cv.id="fxCanvas";document.body.appendChild(cv);cx=cv.getContext("2d")}
  const top=document.querySelector("dialog[open]");(top||document.body).appendChild(cv);
  cv.width=innerWidth;cv.height=innerHeight;
  const cols=["#FF6B5A","#4cd6a0","#ffd166","#6ea8fe","#ff8fd1","#fff"];
  for(let i=0;i<n;i++)parts.push(burst?{x:innerWidth/2,y:innerHeight/2,vx:(Math.random()-.5)*16,vy:Math.random()*-14-4,r:Math.random()*6+4,c:cols[i%6],a:Math.random()*6,s:(Math.random()-.5)*.3,l:120}
    :{x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.5,vx:(Math.random()-.5)*3,vy:Math.random()*3+2,r:Math.random()*6+4,c:cols[i%6],a:Math.random()*6,s:(Math.random()-.5)*.3,l:260});
  if(!raf)loop()}
function loop(){cx.clearRect(0,0,cv.width,cv.height);parts=parts.filter(p=>p.l-->0&&p.y<cv.height+30);
  parts.forEach(p=>{p.vy+=.25;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.s;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);cx.restore()});
  raf=parts.length?requestAnimationFrame(loop):(cx.clearRect(0,0,cv.width,cv.height),0)}

const card=()=>document.querySelector("#dlg .card");
function anim(el,cls,ms){if(!el)return;el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);setTimeout(()=>el.classList.remove(cls),ms||900)}
const wrap=(name,fn)=>{try{const orig=eval(name);if(typeof orig!=="function")return;const w=function(...a){return fn(orig,this,a)};eval(name+"=w")}catch(e){console.warn("fx: cannot hook",name,e)}};

wrap("openClue",(o,t,a)=>{SFX.pick();return o.apply(t,a)});
wrap("judge",(o,t,a)=>{const k=a[0],dd=typeof current!=="undefined"&&current&&current.dd;const r=o.apply(t,a);
  if(k==="right"){SFX.right();anim(card(),"fx-right");confetti(dd?160:70,true)}
  else if(k==="wrong"){SFX.wrong();anim(card(),"fx-wrong",500)}
  else if(k==="skip")SFX.skip();
  return r});
wrap("resolveGroup",(o,t,a)=>{let b=null;try{b=teams.map(x=>x.score)}catch(e){}const r=o.apply(t,a);try{const up=teams.some((x,i)=>x.score>b[i]),dn=teams.some((x,i)=>x.score<b[i]);if(up){SFX.right();anim(card(),"fx-right");confetti(70,true)}else if(dn){SFX.wrong();anim(card(),"fx-wrong",500)}else SFX.reveal()}catch(e){}return r});
wrap("startDD",(o,t,a)=>{const r=o.apply(t,a);SFX.dd();anim(card(),"fx-dd",1600);return r});
wrap("showPerk",(o,t,a)=>{const r=o.apply(t,a);if(a[0]==="bomb"){SFX.bomb();anim(card(),"fx-boom",700);anim(document.querySelector("main"),"fx-boom",700)}else SFX.delegate();return r});
wrap("showAnswer",(o,t,a)=>{const r=o.apply(t,a);const el=document.getElementById("answer");if(!el.hidden){SFX.reveal();anim(el,"fx-show",500)}return r});
wrap("showEnd",(o,t,a)=>{const r=o.apply(t,a);anim(document.getElementById("answer"),"fx-show",500);return r});
wrap("showResults",(o,t,a)=>{const r=o.apply(t,a);SFX.win();confetti(250,false);setTimeout(()=>confetti(120,true),400);return r});
const deal=()=>{const b=document.getElementById("board");if(!b||RM)return;[...b.children].forEach((c,i)=>{c.style.animationDelay=(i%5)*60+Math.floor(i/5)*50+"ms"});anim(b,"fx-deal",1600)};
wrap("newGame",(o,t,a)=>{const r=o.apply(t,a);setTimeout(deal,0);return r});

/* score changes */
let prev=null;try{prev=teams.map(x=>x.score)}catch(e){}
wrap("renderTeams",(o,t,a)=>{const r=o.apply(t,a);try{
  const now=teams.map(x=>x.score),cards=document.querySelectorAll("#teams .team");
  if(prev&&prev.length===now.length)now.forEach((s,i)=>{const d=s-prev[i];if(!d||!cards[i])return;const sc=cards[i].querySelector(".score");
    anim(sc,"fx-pop",500);anim(sc,d>0?"fx-up":"fx-down",900);
    if(!RM){const f=document.createElement("div");f.className="fx-float";f.textContent=(d>0?"+$":"-$")+Math.abs(d).toLocaleString();f.style.color=d>0?"var(--good)":"var(--bad)";cards[i].appendChild(f);setTimeout(()=>f.remove(),1200)}
    if(!document.querySelector("#dlg[open]"))(d>0?SFX.coin:SFX.down)()});
  prev=now}catch(e){}return r});

/* timer ticks & time up */
const tm=document.getElementById("timer");
if(tm)new MutationObserver(()=>{if(tm.hidden)return;const n=parseInt(tm.textContent,10);
  if(n===0)SFX.timeup();else if(tm.classList.contains("late")){SFX.tick();anim(tm,"fx-tick",300)}}).observe(tm,{childList:true,characterData:true,subtree:true});

/* soft clicks on tiles and buttons */
document.addEventListener("click",e=>{const b=e.target.closest("button");if(b&&!b.closest("#dlg .actions")&&!b.classList.contains("tile"))SFX.click()},true);

/* mute button */
const row=document.querySelector("header .row");
if(row){const m=document.createElement("button");m.className="ghost icon";m.id="fxMute";m.type="button";
  const paint=()=>{m.textContent=muted?"🔇":"🔊";m.title=m.ariaLabel=muted?"Sound off":"Sound on"};paint();
  m.onclick=()=>{muted=!muted;try{localStorage.setItem("jp-mute",muted?"1":"0")}catch(e){}paint();if(!muted)SFX.coin()};
  row.insertBefore(m,row.firstChild)}

setTimeout(deal,50);
})();
</script>
<script>
(()=>{
const es=()=>lang==="es",L=(a,b)=>es()?b:a;
const btn=document.createElement("button");btn.className="ghost";btn.id="saveLoadBtn";btn.type="button";
document.getElementById("reset").before(btn);
const d=document.createElement("dialog");d.id="slDlg";
d.innerHTML='<div class="card qs" style="max-width:560px"><h2 id="slH"></h2><p id="slP" style="margin:0"></p><textarea id="slTa" rows="8" style="width:100%;font:12px monospace;background:rgba(0,0,0,.25);color:inherit;border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:8px"></textarea><p id="slMsg" role="status" style="margin:0;min-height:1.2em;font-weight:700"></p><div class="actions"><button type="button" id="slDl"></button><button type="button" id="slCp"></button><button type="button" id="slLd"></button><button type="button" id="slFile"></button><button type="button" id="slX" class="skip"></button></div><input type="file" id="slIn" accept=".json,application/json" hidden></div>';
document.body.appendChild(d);
const $=id=>document.getElementById(id),msg=t=>$("slMsg").textContent=t;
function lbl(){btn.textContent=L("Save / Load","Guardar / Cargar");$("slH").textContent=L("Save or load this game setup","Guardar o cargar esta configuración");
 $("slP").textContent=L("Export copies Board 1, Board 2, your custom categories, team names and difficulty as text you can keep. To load it later, paste it here and press Load.","Exportar genera un texto con el Tablero 1, el Tablero 2, tus categorías propias, los nombres de equipos y la dificultad. Para cargarlo después, pegalo acá y apretá Cargar.");
 $("slDl").textContent=L("Export & download","Exportar y descargar");$("slCp").textContent=L("Copy","Copiar");$("slLd").textContent=L("Load from text","Cargar desde texto");$("slFile").textContent=L("Load from file","Cargar desde archivo");$("slX").textContent=L("Close","Cerrar")}
const snap=()=>JSON.stringify({app:"family-jeopardy",v:2,board:board.filter(c=>!c.virt),board2:board2Saved||null,customCats,diff,teams:teams.map(t=>({name:t.name||null,color:t.color||null}))},null,1);
btn.onclick=()=>{lbl();$("slTa").value="";msg("");d.showModal()};
$("slX").onclick=()=>d.close();
$("slDl").onclick=async()=>{const t=snap();$("slTa").value=t;
 try{const dl=window.claude&&await claude.use("downloads");
  if(dl){await dl.save({filename:"jeopardy-board.json",data:t});msg(L("Exported.","Exportado."));return}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"application/json"}));a.download="jeopardy-board.json";document.body.appendChild(a);a.click();a.remove();msg(L("Exported. If no file was saved, use Copy.","Exportado. Si no se guardó un archivo, usá Copiar."))
 }catch(e){msg(e&&e.code==="declined"?L("Cancelled. You can still use Copy.","Cancelado. Todavía podés usar Copiar."):L("Use Copy and paste it into a text file.","Usá Copiar y pegalo en un archivo de texto."))}};
$("slCp").onclick=()=>{if(!$("slTa").value)$("slTa").value=snap();$("slTa").select();
 try{navigator.clipboard.writeText($("slTa").value).then(()=>msg(L("Copied.","Copiado.")),()=>{document.execCommand("copy");msg(L("Selected: press Ctrl+C.","Seleccionado: apretá Ctrl+C."))})}catch(e){msg(L("Selected: press Ctrl+C.","Seleccionado: apretá Ctrl+C."))}};
function load(txt){
 try{const o=JSON.parse(txt);if(!o||!validBoard(o.board))throw 0;
  if(Array.isArray(o.customCats)){customCats=o.customCats.filter(c=>c&&typeof c.cat==="string"&&Array.isArray(c.qs)&&c.qs.length>=1&&c.qs.every(x=>Array.isArray(x)&&typeof x[0]==="string"&&typeof x[1]==="string")).slice(0,30);syncCustomLib();try{localStorage.setItem("jp-customcats",JSON.stringify(customCats))}catch(e){}}
  board=o.board;custom=true;try{localStorage.setItem("jp-board",JSON.stringify(board))}catch(e){}
  if(o.board2&&validBoard(o.board2)){board2Saved=o.board2;try{localStorage.setItem("jp-board2",JSON.stringify(board2Saved))}catch(e){}}
  else{board2Saved=null;try{localStorage.removeItem("jp-board2")}catch(e){}}
  edStore={1:null,2:null};ed2Orig="";edWhich=1;
  if(o.diff&&DIFF[o.diff]){diff=o.diff;try{localStorage.setItem("jp-diff2",diff)}catch(e){}}
  if(Array.isArray(o.teams)&&o.teams.length>=2&&o.teams.length<=10){while(teams.length<o.teams.length)teams.push({name:null,score:0});teams=teams.slice(0,o.teams.length);teams.forEach((t,i)=>{t.name=o.teams[i].name;if(o.teams[i].color)t.color=o.teams[i].color});saveTeams()}
  undoStack=[];newGame();applyLang();d.close()
 }catch(e){msg(L("That text is not a valid board.","Ese texto no es un tablero válido."))}}
$("slLd").onclick=()=>load($("slTa").value);
$("slFile").onclick=()=>$("slIn").click();
$("slIn").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>load(String(r.result));r.readAsText(f);e.target.value=""};
lbl();window.addEventListener("click",()=>setTimeout(lbl,50));
})();
</script>
</body>
